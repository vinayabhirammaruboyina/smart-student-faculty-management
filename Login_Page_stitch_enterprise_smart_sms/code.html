<style>
        body {
            background-color: #051424; /* surface-dim */
            color: #d4e4fa; /* on-surface */
        }
        
        .glass-panel {
            background: rgba(18, 33, 49, 0.4); /* surface-container with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .input-punched {
            background-color: #010f1f; /* surface-container-lowest */
            border: 1px solid #273647; /* surface-variant */
            color: #d4e4fa;
            transition: all 0.2s ease;
        }

        .input-punched:focus {
            outline: none;
            border-color: #c3c0ff; /* primary */
            box-shadow: 0 0 0 2px rgba(195, 192, 255, 0.2);
        }

        .bg-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-pattern">
<!-- Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container rounded-full opacity-10 blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-md px-md z-10">
<!-- Brand Section -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-xs">
                Smart SMS
            </h1>
<p class="font-label-md text-label-md text-outline uppercase tracking-widest">
                Enterprise Portal
            </p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-xl p-lg relative overflow-hidden">
<!-- Top Light Accent -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<form class="space-y-md">
<!-- Academic ID Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="academic-id">Academic ID</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">badge</span>
</span>
<input autocomplete="username" class="input-punched w-full rounded-DEFAULT font-label-md text-label-md py-sm pl-xl pr-sm" id="academic-id" placeholder="USR-2026-001" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">lock</span>
</span>
<input autocomplete="current-password" class="input-punched w-full rounded-DEFAULT font-label-md text-label-md py-sm pl-xl pr-sm" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Biometric Auth -->
<div class="flex items-center mt-sm">
<input class="w-4 h-4 rounded-DEFAULT bg-surface-container-lowest border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-dim focus:ring-2 cursor-pointer" id="biometric-auth" type="checkbox"/>
<label class="ml-sm flex items-center font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="biometric-auth">
<span class="material-symbols-outlined text-[16px] mr-xs text-primary">fingerprint</span>
                        Secure Biometric Auth
                    </label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container hover:bg-on-primary-fixed-variant text-on-primary-container font-headline-sm text-headline-sm py-sm rounded-DEFAULT transition-colors duration-200 mt-md flex justify-center items-center" type="button">
                    Sign In
                    <span class="material-symbols-outlined ml-xs text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-md border-t border-white/5 text-center">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Request Access</a>
</div>
</div>
<!-- Footer -->
<div class="mt-xl text-center flex flex-col items-center justify-center opacity-60">
<span class="material-symbols-outlined text-[24px] text-error mb-xs">warning</span>
<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest">
                Authorized Personnel Only
            </p>
</div>
</div>
</body></html>
